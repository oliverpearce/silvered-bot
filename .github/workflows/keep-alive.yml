# Pings the bot's status page twice a day, like a cron job.
# Set the BOT_URL repository secret to your Wispbyte address, e.g. http://123.45.67.89:25565
# (Settings → Secrets and variables → Actions → New repository secret).
# If the bot is down the run fails and GitHub emails you.
name: Keep alive

on:
  schedule:
    - cron: '0 8,20 * * *' # twice a day, 08:00 and 20:00 UTC. GitHub may run it a bit late when busy.
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the bot
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        run: |
          if [ -z "$BOT_URL" ]; then
            echo "::error::Set the BOT_URL repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors "${BOT_URL%/}/health"
          echo
